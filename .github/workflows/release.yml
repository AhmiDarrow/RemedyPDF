name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.3.0). Leave empty to use git ref."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-gate:
    name: Test gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install + test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
          pytest -q

  build-windows:
    name: Build Windows installer + portable
    needs: test-gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows (PyInstaller + Inno Setup)
        run: python build_windows.py

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist/win
          VER=$(python -c "import pathlib,re; t=pathlib.Path('src/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")
          echo "version=$VER"
          if [ -f dist/RemedyPDF.exe ]; then
            cp dist/RemedyPDF.exe "dist/win/RemedyPDF-${VER}-windows.exe"
            cp dist/RemedyPDF.exe dist/win/RemedyPDF.exe
          else
            echo "Missing dist/RemedyPDF.exe" >&2
            ls -la dist || true
            exit 1
          fi
          # Prefer Inno installer; fall back to onefile named as setup
          SETUP=""
          for f in dist/RemedyPDF-*-windows-setup.exe dist/*Setup*.exe dist/*-setup.exe; do
            if [ -f "$f" ]; then SETUP="$f"; break; fi
          done
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "dist/win/RemedyPDF-${VER}-windows-setup.exe"
          else
            echo "WARN: no Inno Setup output — shipping onefile as setup asset"
            cp dist/RemedyPDF.exe "dist/win/RemedyPDF-${VER}-windows-setup.exe"
          fi
          ls -la dist/win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/win/*
          if-no-files-found: error

  build-android:
    name: Build Android package
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Android cmdline tools + Buildozer deps
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk unzip wget libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv
          # Android command-line tools into project-local tools/ (writable)
          SDK_ROOT="${GITHUB_WORKSPACE}/tools/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          # Normalize layout: cmdline-tools/latest
          if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/tmp/sdk-lic.txt || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Package Android (APK if toolchain, else src zip)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          REMEDYPDF_MOBILE: "1"
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install buildozer cython virtualenv || true
          python build_android.py
          mkdir -p dist/android
          VER=$(python -c "import pathlib,re; t=pathlib.Path('src/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")
          shopt -s nullglob
          for f in dist/RemedyPDF-*-android.apk; do cp "$f" dist/android/; done
          for f in dist/RemedyPDF-*-android-src.zip; do cp "$f" dist/android/; done
          if [ -z "$(ls -A dist/android 2>/dev/null)" ]; then
            echo "No android artifacts — fail" >&2
            ls -la dist || true
            exit 1
          fi
          ls -la dist/android
          # Prefer real APK when present
          if ls dist/android/*.apk >/dev/null 2>&1; then
            echo "OK real APK present"
          else
            echo "WARN: APK not produced — src zip only (Buildozer may need longer first run)"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/android/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python -c "import pathlib,re; t=pathlib.Path('src/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files + latest.json
        shell: bash
        run: |
          set -e
          mkdir -p dist/release
          find artifacts -type f -print
          find artifacts -type f -exec cp {} dist/release/ \;
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          SETUP="RemedyPDF-${VER}-windows-setup.exe"
          EXE="RemedyPDF-${VER}-windows.exe"
          APK_ARGS=()
          AZIP_ARGS=()
          for f in dist/release/*.apk; do
            if [ -f "$f" ]; then APK_ARGS=(--apk-name "$(basename "$f")"); break; fi
          done
          for f in dist/release/*android-src.zip dist/release/*android*.zip; do
            if [ -f "$f" ]; then AZIP_ARGS=(--android-zip-name "$(basename "$f")"); break; fi
          done
          if [ ! -f "dist/release/$SETUP" ]; then
            if [ -f dist/release/RemedyPDF.exe ]; then
              cp dist/release/RemedyPDF.exe "dist/release/$SETUP"
            fi
          fi
          if [ ! -f "dist/release/$EXE" ] && [ -f dist/release/RemedyPDF.exe ]; then
            cp dist/release/RemedyPDF.exe "dist/release/$EXE"
          fi
          python scripts/write_latest_json.py \
            --version "$VER" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --setup-name "$SETUP" \
            --exe-name "$EXE" \
            --out dist/release/latest.json \
            "${APK_ARGS[@]}" \
            "${AZIP_ARGS[@]}"
          cp resources/icon.png dist/release/icon.png || true
          ls -la dist/release
          cat dist/release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: RemedyPDF ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## RemedyPDF ${{ steps.ver.outputs.tag }}

            Fast multi-format document viewer and editor — PDF, EPUB, XPS, CBZ, and more.

            Hi I'm Ahmi, hope this helps!
            - Profile: https://github.com/AhmiDarrow
            - Repo: https://github.com/${{ github.repository }}

            ### Install

            | Platform | Asset |
            |----------|--------|
            | **Windows** | `RemedyPDF-*-windows-setup.exe` (Inno Setup — Start Menu + Desktop) |
            | **Windows portable** | `RemedyPDF-*-windows.exe` / `RemedyPDF.exe` |
            | **Android** | `RemedyPDF-*-android.apk` or `*-android-src.zip` |

            Help → About → **Check for updates** uses GitHub Releases + `latest.json`.

            ### Notes
            - Themes, both-sides book mode, fine zoom, mobile polish
            - Auto-update via GitHub Releases + `latest.json` (windows-x86_64 + android-arm64)

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
