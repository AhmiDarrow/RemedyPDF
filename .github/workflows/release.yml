name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.3.4). Leave empty to use git ref."
        required: false
        default: ""
      build_apk:
        description: "Also attempt full Buildozer APK (slow, often fails on free runners)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-gate:
    name: Test gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install + test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller
          pytest -q

  build-windows:
    name: Build Windows installer + portable
    needs: test-gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows (PyInstaller + Inno Setup)
        run: python build_windows.py

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist/win
          VER=$(python -c "import pathlib,re; t=pathlib.Path('src/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")
          echo "version=$VER"
          if [ -f dist/RemedyPDF.exe ]; then
            cp dist/RemedyPDF.exe "dist/win/RemedyPDF-${VER}-windows.exe"
            cp dist/RemedyPDF.exe dist/win/RemedyPDF.exe
          else
            echo "Missing dist/RemedyPDF.exe" >&2
            ls -la dist || true
            exit 1
          fi
          SETUP=""
          for f in dist/RemedyPDF-*-windows-setup.exe dist/*Setup*.exe dist/*-setup.exe; do
            if [ -f "$f" ]; then SETUP="$f"; break; fi
          done
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "dist/win/RemedyPDF-${VER}-windows-setup.exe"
          else
            echo "WARN: no Inno Setup output — shipping onefile as setup asset"
            cp dist/RemedyPDF.exe "dist/win/RemedyPDF-${VER}-windows-setup.exe"
          fi
          ls -la dist/win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/win/*
          if-no-files-found: error

  build-android:
    name: Build Android package
    needs: test-gate
    runs-on: ubuntu-latest
    # Fast by default: zip-only. Full Buildozer is opt-in (workflow_dispatch build_apk=true).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Package Android (zip-first, always)
        env:
          REMEDYPDF_MOBILE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pillow pymupdf || true

          # Always emit versioned android-src.zip (reliable release asset)
          python build_android.py --zip-only

          mkdir -p dist/android
          shopt -s nullglob
          for f in dist/RemedyPDF-*-android-src.zip; do
            [ -f "$f" ] || continue
            cp "$f" dist/android/
          done
          if [ -z "$(ls -A dist/android 2>/dev/null)" ]; then
            echo "No android zip — fail" >&2
            ls -la dist || true
            exit 1
          fi
          ls -la dist/android
          echo "OK android-src zip staged (fast path)"

      - name: Optional Buildozer APK (slow, opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_apk == 'true' }}
        timeout-minutes: 150
        env:
          REMEDYPDF_MOBILE: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openjdk-17-jdk unzip wget curl git zip \
            libffi-dev libssl-dev autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake build-essential \
            ccache libltdl-dev
          pip install buildozer cython virtualenv

          SDK_ROOT="${GITHUB_WORKSPACE}/tools/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd /tmp
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -fsSL -o cmdtools.zip "$URL"
          unzip -q cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          if [ -d "$SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          yes 2>/dev/null | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/tmp/sdk-lic.txt || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653" || true

          cd "${GITHUB_WORKSPACE}"
          python build_android.py --prefer-apk || echo "WARN: Buildozer APK failed; keeping src zip"
          shopt -s nullglob
          for f in dist/RemedyPDF-*-android.apk bin/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" dist/android/
          done
          ls -la dist/android || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/android/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python -c "import pathlib,re; t=pathlib.Path('src/__init__.py').read_text(encoding='utf-8'); print(re.search(r'__version__\\s*=\\s*[\"\\']([^\"\\']+)', t).group(1))")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files + latest.json
        shell: bash
        run: |
          set -e
          mkdir -p dist/release
          find artifacts -type f -print
          find artifacts -type f -exec cp {} dist/release/ \;
          VER="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          SETUP="RemedyPDF-${VER}-windows-setup.exe"
          EXE="RemedyPDF-${VER}-windows.exe"
          APK_ARGS=()
          AZIP_ARGS=()
          for f in dist/release/*.apk; do
            if [ -f "$f" ]; then APK_ARGS=(--apk-name "$(basename "$f")"); break; fi
          done
          for f in dist/release/*android-src.zip dist/release/*android*.zip; do
            if [ -f "$f" ]; then AZIP_ARGS=(--android-zip-name "$(basename "$f")"); break; fi
          done
          if [ ! -f "dist/release/$SETUP" ]; then
            if [ -f dist/release/RemedyPDF.exe ]; then
              cp dist/release/RemedyPDF.exe "dist/release/$SETUP"
            fi
          fi
          if [ ! -f "dist/release/$EXE" ] && [ -f dist/release/RemedyPDF.exe ]; then
            cp dist/release/RemedyPDF.exe "dist/release/$EXE"
          fi
          # Prefer real APK URL in latest.json when present; else point android-arm64 at src zip
          python scripts/write_latest_json.py \
            --version "$VER" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --setup-name "$SETUP" \
            --exe-name "$EXE" \
            --out dist/release/latest.json \
            "${APK_ARGS[@]}" \
            "${AZIP_ARGS[@]}"
          # If no APK, rewrite android-arm64 primary url to src zip so autoupdate is not a 404
          python - <<'PY'
          import json, glob, pathlib
          p = pathlib.Path("dist/release/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          apks = list(pathlib.Path("dist/release").glob("*.apk"))
          zips = list(pathlib.Path("dist/release").glob("*android-src.zip")) + list(
              pathlib.Path("dist/release").glob("*android*.zip")
          )
          plat = data.setdefault("platforms", {}).setdefault("android-arm64", {})
          if not apks and zips:
              z = zips[0].name
              tag = data.get("tag_name") or ""
              repo = "${{ github.repository }}"
              base = f"https://github.com/{repo}/releases/download/{tag}"
              plat["url"] = f"{base}/{z}"
              plat["src_zip_url"] = f"{base}/{z}"
              plat["kind"] = "android-src-zip"
              data.setdefault("assets", {})["android_apk"] = ""
              data["assets"]["android_src_zip"] = z
              data["notes"] = (data.get("notes") or "") + (
                  " Android ships as mobile source zip (Buildozer APK is opt-in on CI)."
              )
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print("latest.json android-arm64 -> src zip", z)
          else:
              print("latest.json left as-is; apks=", [a.name for a in apks])
          print(p.read_text(encoding="utf-8"))
          PY
          cp resources/icon.png dist/release/icon.png || true
          ls -la dist/release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: RemedyPDF ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## RemedyPDF ${{ steps.ver.outputs.tag }}

            Fast multi-format document viewer and editor — PDF, EPUB, XPS, CBZ, and more.

            Hi I'm Ahmi, hope this helps!
            - Profile: https://github.com/AhmiDarrow
            - Repo: https://github.com/${{ github.repository }}

            ### Install

            | Platform | Asset |
            |----------|--------|
            | **Windows** | `RemedyPDF-*-windows-setup.exe` (Inno Setup — Start Menu + Desktop) |
            | **Windows portable** | `RemedyPDF-*-windows.exe` / `RemedyPDF.exe` |
            | **Android** | `*-android-src.zip` (mobile package; full APK via opt-in CI) |

            Help → About → **Check for updates** uses GitHub Releases + `latest.json`.

            ### Notes
            - Themes recolor chrome **and** document text/paper
            - Both-sides book mode, fine zoom, mobile polish
            - Android CI is **zip-first** (fast/reliable). Full Buildozer APK is workflow_dispatch `build_apk=true`.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
