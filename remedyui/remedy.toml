# Packaging (`cargo remedy package`). Run pack/build-release.ps1 rather than calling it
# directly: it writes target/notices first.

[app]
name = "RemedyPDF"
id = "com.ahmidarrow.remedypdf"
publisher = "Ahmi Darrow"
description = "Multi-format document viewer and editor"
icon = "../resources/icon.png"

[windows]
# RemedyPDF 1.x's installer id: Setup upgrades that install in place, in the same folder.
app_id = "{B7E2C4A1-8F3D-4A9E-9C1B-5D6E8F0A2B3C}"
# What 1.x (Python) installed that 2.x does not.
remove = ["_internal", "resources"]
files = ["pdfium/pdfium.dll", "target/notices/THIRD-PARTY-NOTICES.txt", "target/notices/pdfium-licenses"]
# In-app updates run Setup silently; it reopens the app.
relaunch_after_update = true

[linux]
# Runs on Debian 10, Ubuntu 20.04, RHEL 8 and later. PDFium is inside the program.
glibc = "2.28"
files = ["target/notices/THIRD-PARTY-NOTICES.txt", "target/notices/pdfium-licenses"]

[android]
# One APK for 64-bit and 32-bit ARM phones.
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
min_api = 26
target_api = 35
libs = ["pdfium/{abi}/libpdfium.so"]
# The key every update must be signed with (password in REMEDY_ANDROID_KEYSTORE_PASSWORD).
keystore = "../../Keys/RemedyPDF/android-release.keystore"
key_alias = "remedypdf"
# Fetching updates, and handing a verified one to Android's installer.
permissions = ["internet", "android.permission.REQUEST_INSTALL_PACKAGES"]
